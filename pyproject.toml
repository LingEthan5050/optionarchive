[project]
name = "chain-archiver"
version = "0.1.0"
description = "Daily option chain + market metric snapshots from the tastytrade API."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.11",       # Brent's method for the IV solve
    "pyarrow>=15",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",       # zoneinfo needs this on Windows
    # Core, not optional: every CLI command imports the trading calendar.
    "pandas_market_calendars>=4.4",
]

[project.optional-dependencies]
# Present from the first commit so that the day data exists, you can look at it (§5).
dev = [
    "duckdb>=1.0",
    "jupyter>=1.0",
    "pandas>=2.0",
    "streamlit>=1.30",
]
# The Discord account bot. Optional because the archiver never needs it and
# it is the one component that touches account data rather than market data.
bot = [
    "discord.py>=2.4",
]

[project.scripts]
archiver = "chain_archiver.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chain_archiver", "account_bot"]
