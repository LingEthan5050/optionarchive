[project]
name = "chain-archiver"
version = "0.1.0"
description = "Daily option chain + market metric snapshots from the tastytrade API."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyarrow>=15",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",       # zoneinfo needs this on Windows
]

[project.optional-dependencies]
# Present from the first commit so that the day data exists, you can look at it (§5).
dev = [
    "duckdb>=1.0",
    "jupyter>=1.0",
    "pandas>=2.0",
]
# Phase 2+
schedule = [
    "pandas_market_calendars>=4.4",
    "pyyaml>=6.0",
]

[project.scripts]
archiver = "chain_archiver.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chain_archiver"]
